name: Auto Version Bump

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest
    # Skip version bump commits to avoid infinite loop
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from commit messages
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" -20)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
          fi

          if echo "$COMMITS" | grep -qE "^(feat!|fix!|refactor!)|BREAKING CHANGE"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump version and trigger build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump root (source of truth for Docker image tags)
          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          # Keep frontend in sync
          npm version "${NEW_VERSION}" --workspace=packages/frontend --no-git-tag-version

          git add package.json packages/frontend/package.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push

      # GITHUB_TOKEN pushes don't trigger workflows; dispatch the build explicitly
      - name: Trigger build-and-push
        run: |
          gh workflow run build-and-push.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
